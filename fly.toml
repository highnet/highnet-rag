# One Fly.io app: FastAPI serves the static export and /api (SSE) from a single machine.
# Secrets (never here): fly secrets set ANTHROPIC_API_KEY=... VOYAGE_API_KEY=... IP_HASH_SALT=...
app = "highnet-rag"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  CLAUDE_MODEL_DEFAULT = "claude-haiku-4-5"
  CLAUDE_MODEL_DEMO = "claude-opus-5"
  BUDGET_MONTHLY_USD = "20"
  RATE_LIMIT_PER_MIN = "20"
  RATE_LIMIT_PER_DAY = "200"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # SSE runs are long-lived connections: limit by connections, not requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "rag_data"
  destination = "/data"
