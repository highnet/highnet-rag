[project]
name = "highnet-rag"
version = "0.1.0"
description = "Transparent RAG pipeline: FastAPI + SSE trace events, SQLite (sqlite-vec + FTS5)."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=1.0",
  "httpx>=0.27",
  "sqlite-vec>=0.1.6",
  "numpy>=2.0",
]

[project.scripts]
highnet-rag = "highnet_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highnet_rag"]
