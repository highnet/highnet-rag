[project]
name = "highnet-rag-evals"
version = "0.1.0"
description = "Offline retrieval and faithfulness evals for highnet-rag."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["highnet-rag"]

[tool.uv.sources]
highnet-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highnet_rag_evals"]
